# Example Home Assistant package for roofcast.
# Put it in config/packages/ (with `homeassistant: packages: !include_dir_named packages`) and adapt the names.
# Entity ids below match the defaults of roofcast.example.yaml.

input_boolean:
  pv_forecast_use_ensemble:
    name: Use roofcast forecast for EMHASS
    icon: mdi:solar-power-variant

template:
  - binary_sensor:
      # On when the last publication is younger than 2 h and came from at least 3 weather models.
      - name: PV forecast fresh
        unique_id: pv_forecast_fresh
        device_class: connectivity
        state: >-
          {% set g = state_attr('sensor.pv_forecast_today', 'generated_at') %}
          {% set n = state_attr('sensor.pv_forecast_today', 'models_ok') | int(0) %}
          {{ g is not none and (now() - as_datetime(g)).total_seconds() < 7200 and n >= 3 }}

  - sensor:
      # The forecast EMHASS should use: this one when the switch is on and it is fresh, otherwise another
      # Solcast-format sensor you already have (change the fallback entity id to yours here and in `fallback` in the
      # REST command below, or remove it).
      - name: PV forecast source
        unique_id: pv_forecast_source
        state: >-
          {{ 'sensor.pv_forecast_today'
             if is_state('input_boolean.pv_forecast_use_ensemble', 'on') and is_state('binary_sensor.pv_forecast_fresh', 'on')
             else 'sensor.solcast_pv_forecast_forecast_today' }}

# EXAMPLE: pass the forecast to EMHASS for an MPC run. pv_power_forecast_p10 needs EMHASS 0.18.4 or newer.
# Tested on EMHASS 0.18.8: rendered on Home Assistant 2026.11 with real RoofCast and Solcast sensors and 75 edge-case
# checks, payloads run offline at 15, 30 and 60-min steps; the previous version was also POSTed to a live instance at
# a 15-min step. Adapt the four settings at the top of the payload. EMHASS URL is an example.
# - The curve goes as a timestamp -> W mapping, so EMHASS places each 30-min slot by its time and holds it until the
#   next one (a plain list would be read as one value per step, which on a 15-min step squeezes the day into half
#   the time without a warning).
# - Because EMHASS holds values forward and backfills before the first one, it cannot see a gap. The payload only
#   sends an unbroken run of 30-min rows starting at the row that contains "now", sorted, without duplicates, and
#   stops at the first missing slot or invalid value. The selected source is tried first, then the fallback; the
#   first that covers 5 steps is sent. If none does (EMHASS refuses a shorter MPC horizon), the PV keys are left
#   out and EMHASS uses its configured forecast method.
# - step_min must match optimization_time_step in your EMHASS config; it only sets prediction_horizon.
# - soc_entity is your battery SOC sensor in %, clamped to 0..100. Without soc_init EMHASS starts every run from
#   battery_target_state_of_charge instead of the real SOC. If its state is not a finite number (unavailable,
#   unknown, nan) the template fails and nothing is sent, rather than planning from a made-up SOC. soc_final is
#   left to your EMHASS config.
#   No battery: set soc_entity to none and soc_init is left out.
# - P10 is sent as pv_power_forecast_p10, capped at P50 (P50 when missing). It only changes the plan when
#   weather_forecast_pv_quantile_bias is above 0 (0 is the default), set in the EMHASS config or added to this
#   payload: the plan then uses bias * P10 + (1 - bias) * P50.
# - The Solcast integration splits today and tomorrow over two sensors, so the fallback reads both.
rest_command:
  emhass_naive_mpc_optim:
    url: http://localhost:5000/action/naive-mpc-optim
    method: POST
    content_type: application/json
    payload: >-
      {%- set step_min = 30 -%}
      {%- set horizon_h = 24 -%}
      {%- set soc_entity = 'sensor.battery_soc' -%}{#- none if you have no battery -#}
      {%- set fallback = ['sensor.solcast_pv_forecast_forecast_today', 'sensor.solcast_pv_forecast_forecast_tomorrow'] -%}
      {%- set src = states('sensor.pv_forecast_source') -%}
      {#- Sources tried in order (the sensors of one source are merged): the selected one, then the fallback. -#}
      {%- set sources = [fallback] if src in fallback or src in ['unknown', 'unavailable'] else [[src], fallback] -%}
      {%- set g = namespace(groups=[]) -%}
      {%- for one in sources -%}
        {%- set m = namespace(rows=[]) -%}
        {%- for e in one -%}
          {%- set a = state_attr(e, 'detailedForecast') -%}
          {%- set m.rows = m.rows + (a if a is list else []) -%}
        {%- endfor -%}
        {%- set g.groups = g.groups + [m.rows] -%}
      {%- endfor -%}
      {%- set groups = g.groups -%}
      {%- set soc_state = states(soc_entity) if soc_entity else none -%}
      {%- set slot = 1800 -%}
      {%- set now_ts = now().timestamp() -%}
      {%- set max_steps = (horizon_h * 60 / step_min) | int -%}
      {%- set best = namespace(k=[], p50=[], p10=[], steps=0) -%}
      {%- for rows in groups -%}
        {%- if best.steps < 5 -%}
          {%- set c = namespace(items=[]) -%}
          {%- for r in rows -%}
            {%- set t = as_timestamp(r.period_start, none) if r is mapping else none -%}
            {%- if t is number and t > now_ts - slot -%}
              {%- set c.items = c.items + [{'t': t, 'p50': r.pv_estimate, 'p10': r.pv_estimate10}] -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set w = namespace(k=[], p50=[], p10=[], next=none, ok=true) -%}
          {%- for it in c.items | sort(attribute='t') -%}
            {%- if w.ok and not (w.next is number and it.t < w.next) -%}
              {%- set v = it.p50 -%}
              {%- set good = v is number and v is not boolean and is_number(v) and v >= 0 -%}
              {%- set w.ok = good and (it.t <= now_ts if w.next is none else it.t == w.next) -%}
              {%- if w.ok -%}
                {%- set q = it.p10 -%}
                {%- set q = [q, v] | min if (q is number and q is not boolean and q == q and q >= 0) else v -%}
                {%- set w.k = w.k + [it.t | timestamp_utc] -%}
                {%- set w.p50 = w.p50 + [(v * 1000) | round(0)] -%}
                {%- set w.p10 = w.p10 + [(q * 1000) | round(0)] -%}
                {%- set w.next = it.t + slot -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set steps = [(((w.next - now_ts) / (step_min * 60)) | int) if w.next is number else 0, max_steps] | min -%}
          {%- if steps >= 5 -%}
            {%- set best.k = w.k -%}
            {%- set best.p50 = w.p50 -%}
            {%- set best.p10 = w.p10 -%}
            {%- set best.steps = steps -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set p = {'prediction_horizon': max_steps} -%}
      {%- if soc_state is not none -%}
        {%- set soc = [[(soc_state if is_number(soc_state) else 'no SOC') | float / 100, 0] | max, 1] | min -%}
        {%- set p = dict(p, soc_init=soc | round(3)) -%}
      {%- endif -%}
      {%- if best.steps >= 5 -%}
        {%- set p = dict(p, prediction_horizon=best.steps,
                         pv_power_forecast=dict(zip(best.k, best.p50)),
                         pv_power_forecast_p10=dict(zip(best.k, best.p10))) -%}
      {%- endif -%}
      {{ p | tojson }}

