# Example Home Assistant package for roofcast.
# Put it in config/packages/ (with `homeassistant: packages: !include_dir_named packages`) and adapt the names.
# Entity ids below match the defaults of config.example.yaml.

input_boolean:
  pv_forecast_use_ensemble:
    name: Use roofcast forecast for EMHASS
    icon: mdi:solar-power-variant

template:
  - binary_sensor:
      # On when the last publication is younger than 2 h and came from at least 3 weather models.
      - name: PV forecast fresh
        unique_id: pv_forecast_fresh
        device_class: connectivity
        state: >-
          {% set g = state_attr('sensor.pv_forecast_today', 'generated_at') %}
          {% set n = state_attr('sensor.pv_forecast_today', 'models_ok') | int(0) %}
          {{ g is not none and (now() - as_datetime(g)).total_seconds() < 7200 and n >= 3 }}

  - sensor:
      # The forecast EMHASS should use: this one when the switch is on and it is fresh, otherwise another
      # Solcast-format sensor you already have (change the fallback entity id to yours here and in `fallback` in the
      # REST command below, or remove it).
      - name: PV forecast source
        unique_id: pv_forecast_source
        state: >-
          {{ 'sensor.pv_forecast_today'
             if is_state('input_boolean.pv_forecast_use_ensemble', 'on') and is_state('binary_sensor.pv_forecast_fresh', 'on')
             else 'sensor.solcast_pv_forecast_forecast_today' }}

# EXAMPLE: pass the forecast to EMHASS for an MPC run. Tested on EMHASS 0.18.8: payload POSTed to a live instance at a
# 15-min step, and run offline at 15 and 30 min. A 60-min step is untested. pv_power_forecast_p10 needs 0.18.4 or newer.
# The curve goes as a timestamp -> W mapping, so EMHASS places each 30-min slot by its time and holds it until the
# next one. That works for a 15, 30 or 60-min optimization_time_step (a plain list would be read as one value per
# step, which on a 15-min step squeezes the day into half the time without a warning).
# Adapt the four settings at the top of the payload. EMHASS URL is an example.
# - step_min must match optimization_time_step in your EMHASS config; it only sets prediction_horizon. If it is
#   smaller than the real step, the horizon runs past the forecast and EMHASS holds the last value (zero at night).
# - soc_entity is your battery SOC sensor in %. Without soc_init EMHASS starts every run from
#   battery_target_state_of_charge instead of the real SOC. If the sensor is unavailable the template fails and
#   nothing is sent, rather than planning from a made-up SOC. soc_final is left to your EMHASS config.
#   No battery: remove the soc_init entry.
# - P10 is sent as pv_power_forecast_p10. It only changes the plan when weather_forecast_pv_quantile_bias is above 0
#   (0 is the default), set in the EMHASS config or added to this payload: the plan then uses
#   bias * P10 + (1 - bias) * P50.
# - The Solcast integration splits today and tomorrow over two sensors, so the fallback reads both.
# With no forecast rows, or less than 5 steps of them (EMHASS refuses a shorter MPC horizon), the PV keys are left
# out and EMHASS uses its configured forecast method.
rest_command:
  emhass_naive_mpc_optim:
    url: http://localhost:5000/action/naive-mpc-optim
    method: POST
    content_type: application/json
    payload: >-
      {%- set step_min = 30 -%}
      {%- set horizon_h = 24 -%}
      {%- set soc_entity = 'sensor.battery_soc' -%}
      {%- set fallback = ['sensor.solcast_pv_forecast_forecast_today', 'sensor.solcast_pv_forecast_forecast_tomorrow'] -%}
      {%- set src = states('sensor.pv_forecast_source') -%}
      {%- set ns = namespace(rows=[]) -%}
      {%- for e in (fallback if src in fallback or src in ['unknown', 'unavailable'] else [src]) -%}
        {%- set ns.rows = ns.rows + (state_attr(e, 'detailedForecast') or []) -%}
      {%- endfor -%}
      {%- set t0 = now().timestamp() - 1800 -%}
      {%- set out = namespace(k=[], p50=[], p10=[], last=0) -%}
      {%- for r in ns.rows if as_timestamp(r.period_start, 0) > t0 -%}
        {%- set ts = as_timestamp(r.period_start) -%}
        {%- set out.k = out.k + [ts | timestamp_utc] -%}
        {%- set out.p50 = out.p50 + [(r.pv_estimate * 1000) | round(0)] -%}
        {%- set out.p10 = out.p10 + [((r.pv_estimate10 if r.pv_estimate10 is number else r.pv_estimate) * 1000) | round(0)] -%}
        {%- set out.last = [out.last, ts] | max -%}
      {%- endfor -%}
      {%- set max_steps = (horizon_h * 60 / step_min) | int -%}
      {%- set p = {'soc_init': ([states(soc_entity) | float, 100] | min / 100) | round(3), 'prediction_horizon': max_steps} -%}
      {%- set covered = ((out.last + 1800 - now().timestamp()) / (step_min * 60)) | int -%}
      {%- if out.k | count > 0 and covered >= 5 -%}
        {%- set p = dict(p, prediction_horizon=[covered, max_steps] | min,
                         pv_power_forecast=dict(zip(out.k, out.p50)),
                         pv_power_forecast_p10=dict(zip(out.k, out.p10))) -%}
      {%- endif -%}
      {{ p | tojson }}

